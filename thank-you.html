<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | All in One Appliance Repair Mumbai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      background: #ffffff;
      width: 90%;
      max-width: 550px;
      padding: 45px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    .check {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #22a447;
      color: white;
      font-size: 48px;
      line-height: 75px;
    }

    h1 {
      margin: 10px 0;
      color: #222;
      font-size: 32px;
    }

    p {
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .company {
      color: #111;
      font-weight: bold;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #ffb000;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="check">✓</div>

    <h1>Thank You!</h1>

    <p>
      Your repair request has been submitted successfully.
    </p>

    <p>
      Our team will contact you shortly.
    </p>

    <p class="company">
      All in One Appliance Repair Mumbai
    </p>

    <a class="btn" href="https://allinoneappliancerepairmumbai.github.io/">
      Back to Home
    </a>

  </div>

</body>
</html>
